<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!--Adform Global Clicktag START-->
  <!-- mraid.js is supplied by the app in in-app supply; on the web it 404s harmlessly. -->
  <script src="mraid.js"></script>
  <script>
    // Adform click: ?clickTAG= on this page's URL (Adform's %%c1 click macro
    // + ;cpdir= + the CM360 tracker, passed on by loadertagA.js). Everything
    // after "clickTAG=" is the value: it contains "=" and ";" itself, and is
    // the last parameter. An unfilled macro (%%...) or anything that isn't an
    // http(s) URL is ignored, and the CTA falls back to the CM360 tracker.
    var clickTag = "";
    (function () {
      try {
        var q = window.location.search, m = /[?&]clicktag=/i.exec(q);
        if (!m) return;
        var v = q.slice(m.index + m[0].length);
        if (/^https?%3A/i.test(v)) v = decodeURIComponent(v);
        if (/^https?:\/\//i.test(v) && v.indexOf("%%") === -1) clickTag = v;
      } catch (e) { }
    })();
  </script>
  <!--Adform Global Clicktag END-->
  <title>Denk vooruit | Ben jij voorbereid?</title>
  <meta name="description" content="5 situaties. 5 vragen. Denk vooruit." />
  <meta name="theme-color" content="#42145F" />
  <meta property="og:title" content="Denk vooruit | Ben jij voorbereid?" />
  <meta property="og:description" content="5 situaties. 5 vragen. Denk vooruit." />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* Brand purple (Figma bg_purple), same as the game background, so the
         letterbox bars blend into the playable. */
      background-color: #42145F;
      color: rgba(255, 255, 255, 0.87);
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
    }

    #ctabtn {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
      z-index: -1;
    }

    canvas {
      background: transparent;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      background: transparent;
    }

    #app #game-container {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 2 / 3;
      margin: 0 auto !important;
    }

    @media (min-aspect-ratio: 1/1) {
      #app #game-container {
        width: auto !important;
        height: 100% !important;
        aspect-ratio: 2 / 3;
        margin: 0 auto !important;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index.js"></script>
</head>

<body>
  <button id="ctabtn"></button>

  <div id="app">
    <div id="game-container"></div>
  </div>


  <script>
    // ============================================================
    // ADFORM BUILD - Rijksoverheid "Denk vooruit" playable
    // Generated from dist/ by scripts/build-adform.mjs; make changes in the
    // project's index.html or that script, then rebuild.
    // Tag: script.txt -> loadertagA.js -> this page in a 320x480 iframe.
    // ============================================================
    window.trackingPath = "./assets/";
    // DMP tracker; the game appends the event name (src/utils/track.js).
    window.trackingType = "https://staging-dmp-producer.iion.io/tracker/impressions?platform=Adform&campaign_id=112881&publisher_id=iion&event_name=";
    window.setTracker = "";
    window.landingPageUrl = "https://ad.doubleclick.net/ddm/trackclk/N1405923.3848558MATTERKIND1/B35899607.447321502;dc_trk_aid=641193670;dc_trk_cid=256640235;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;ltd=;dc_tdv=1";
    // BEKIJK HOE JE JE VOORBEREIDT: Adform click if the tag passed one.
    window.ctaUrl = clickTag || window.landingPageUrl;

    // Called by the game's CTA (End.clickOut, which also sends CTAClick).
    window.openLanding = function (url) {
      if (!url) return;
      if (typeof mraid !== "undefined" && mraid.open) {
        mraid.open(url);
        return;
      }
      var w = null;
      try { w = window.open(url, "_blank"); } catch (e) { }
      if (!w) {
        // Popup blocked: navigate instead, so the click is never lost.
        try { window.top.location.href = url; } catch (e) { window.location.href = url; }
      }
    };
  </script>
</body>

</html>
