<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- "Your logo here" placeholder — shown when a brand kit has no usable
       logo (missing, or the CDN URL is broken). Neutral by design: reads as
       "drop your logo in", never as part of the brand's creative. -->
  <rect x="8" y="8" width="384" height="224" rx="24" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="3" stroke-dasharray="12 10"/>
  <g fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(200,96)">
      <path d="M-14,-26 h28 a6,6 0 0 1 6,6 v28 a6,6 0 0 1 -6,6 h-28 a6,6 0 0 1 -6,-6 v-28 a6,6 0 0 1 6,-6 z" fill="none" stroke="#A1A1AA" stroke-width="3"/>
      <circle cx="-6" cy="-10" r="4.5"/>
      <path d="M-17,10 l10,-11 7,7 6,-6 11,10 z"/>
    </g>
    <text x="200" y="160" font-size="26" font-weight="bold" letter-spacing="2">YOUR LOGO</text>
    <text x="200" y="188" font-size="15" letter-spacing="1">upload one in the brand panel</text>
  </g>
</svg>
